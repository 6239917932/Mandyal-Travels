name: Portal quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./prisma/ci.db
      BOOKING_TOKEN_SECRET: ci-only-booking-token-secret-not-for-production
      PARTNER_ADMIN_KEY: ci-only-partner-admin-key-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate database client
        run: npm run db:generate

      - name: Verify portal
        run: npm run check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build standalone web image
        run: docker build --target runner --tag mandyal-travels:${{ github.sha }} .
