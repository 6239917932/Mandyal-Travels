name: mandyal-travels-production-contract

# This file defines portable process and security boundaries. It intentionally
# does not provision PostgreSQL, TLS, a secret store, a scheduler, or monitoring.
# Supply every referenced value from an approved secret/configuration manager.
services:
  migrate:
    build:
      context: .
      target: operations
    command: ['npm', 'run', 'db:deploy:postgresql']
    environment:
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?Supply the direct TLS PostgreSQL migration URL}
    cap_drop:
      - ALL
    init: true
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

  app:
    build:
      context: .
      target: runner
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      BOOKING_TOKEN_SECRET: ${BOOKING_TOKEN_SECRET:?Supply BOOKING_TOKEN_SECRET from the secret store}
      DATABASE_URL: ${DATABASE_URL:?Supply the pooled TLS PostgreSQL runtime URL}
      DEPLOYMENT_ENVIRONMENT: production
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Supply MFA_ENCRYPTION_KEY from the secret store}
      NODE_ENV: production
      NOTIFICATION_WORKER_SECRET: ${NOTIFICATION_WORKER_SECRET:?Supply NOTIFICATION_WORKER_SECRET from the secret store}
      AUTOPILOT_WORKER_SECRET: ${AUTOPILOT_WORKER_SECRET:?Supply AUTOPILOT_WORKER_SECRET from the secret store}
      INTEGRATION_OUTBOX_ALLOWED_HOSTS: ${INTEGRATION_OUTBOX_ALLOWED_HOSTS:?Supply the approved integration provider hosts}
      INTEGRATION_OUTBOX_API_KEY: ${INTEGRATION_OUTBOX_API_KEY:?Supply the integration provider key from the secret store}
      INTEGRATION_OUTBOX_ENDPOINT: ${INTEGRATION_OUTBOX_ENDPOINT:?Supply the approved integration provider endpoint}
      INTEGRATION_OUTBOX_WORKER_SECRET: ${INTEGRATION_OUTBOX_WORKER_SECRET:?Supply INTEGRATION_OUTBOX_WORKER_SECRET from the secret store}
      PARTNER_ADMIN_KEY: ${PARTNER_ADMIN_KEY:?Supply PARTNER_ADMIN_KEY from the secret store}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?Supply the public HTTPS origin}
      RELEASE_SHA: ${RELEASE_SHA:?Supply the immutable release revision}
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777

  notification-delivery:
    profiles: ['scheduled-jobs']
    build:
      context: .
      target: worker
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-25}
      NOTIFICATION_WORKER_LEASE_SECONDS: ${NOTIFICATION_WORKER_LEASE_SECONDS:-120}
      NOTIFICATION_WORKER_SECRET: ${NOTIFICATION_WORKER_SECRET:?Supply NOTIFICATION_WORKER_SECRET from the secret store}
      NOTIFICATION_WORKER_TIMEOUT_MS: ${NOTIFICATION_WORKER_TIMEOUT_MS:-30000}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?Supply the public HTTPS origin}
    init: true
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  integration-outbox-delivery:
    profiles: ['scheduled-jobs']
    build:
      context: .
      target: worker
    command: ['npm', 'run', 'worker:integration-outbox']
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    environment:
      INTEGRATION_OUTBOX_WORKER_BATCH_SIZE: ${INTEGRATION_OUTBOX_WORKER_BATCH_SIZE:-25}
      INTEGRATION_OUTBOX_WORKER_LEASE_SECONDS: ${INTEGRATION_OUTBOX_WORKER_LEASE_SECONDS:-300}
      INTEGRATION_OUTBOX_WORKER_SECRET: ${INTEGRATION_OUTBOX_WORKER_SECRET:?Supply INTEGRATION_OUTBOX_WORKER_SECRET from the secret store}
      INTEGRATION_OUTBOX_WORKER_TIMEOUT_MS: ${INTEGRATION_OUTBOX_WORKER_TIMEOUT_MS:-300000}
      NODE_ENV: production
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?Supply the public HTTPS origin}
    init: true
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  safe-maintenance:
    profiles: ['scheduled-jobs']
    build:
      context: .
      target: worker
    command: ['npm', 'run', 'worker:maintenance']
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    environment:
      AUTOPILOT_WORKER_BATCH_SIZE: ${AUTOPILOT_WORKER_BATCH_SIZE:-25}
      AUTOPILOT_WORKER_SECRET: ${AUTOPILOT_WORKER_SECRET:?Supply AUTOPILOT_WORKER_SECRET from the secret store}
      AUTOPILOT_WORKER_TIMEOUT_MS: ${AUTOPILOT_WORKER_TIMEOUT_MS:-30000}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?Supply the public HTTPS origin}
    init: true
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  search-projection-maintenance:
    profiles: ['scheduled-jobs']
    build:
      context: .
      target: worker
    command: ['npm', 'run', 'worker:search-projections']
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    environment:
      AUTOPILOT_WORKER_SECRET: ${AUTOPILOT_WORKER_SECRET:?Supply AUTOPILOT_WORKER_SECRET from the secret store}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?Supply the public HTTPS origin}
      SEARCH_PROJECTION_SOURCE_LIMIT: ${SEARCH_PROJECTION_SOURCE_LIMIT:-5000}
      SEARCH_PROJECTION_WORKER_LEASE_SECONDS: ${SEARCH_PROJECTION_WORKER_LEASE_SECONDS:-300}
      SEARCH_PROJECTION_WORKER_TIMEOUT_MS: ${SEARCH_PROJECTION_WORKER_TIMEOUT_MS:-120000}
    init: true
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
